<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntelAgent</title>
  <style>
    /* ── Theme tokens ── */
    :root[data-theme="dark"] {
      --bg: #161b26;
      --bg-elev: #1c2230;
      --bg-input: #232a3a;
      --border: #2a3142;
      --border-dashed: #2a3142;
      --text: #c8cfdb;
      --text-strong: #e3e7ef;
      --text-muted: #8a93a3;
      --text-faint: #5a6273;
      --accent: #4f81f0;
      --accent-btn: #3b6fd9;
      --accent-btn-hover: #3260c4;
      --btn-disabled: #3a4150;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
      --tool: #818cf8;
      --code: #fbbf24;
      --link: #7aa7f5;
    }

    :root[data-theme="light"] {
      --bg: #f5f6f8;
      --bg-elev: #ffffff;
      --bg-input: #ffffff;
      --border: #d8dde5;
      --border-dashed: #d8dde5;
      --text: #2d3340;
      --text-strong: #11151c;
      --text-muted: #5b6472;
      --text-faint: #94a0b1;
      --accent: #2563eb;
      --accent-btn: #2563eb;
      --accent-btn-hover: #1d4ed8;
      --btn-disabled: #c4cad3;
      --ok: #16a34a;
      --warn: #b45309;
      --err: #dc2626;
      --tool: #4f46e5;
      --code: #b45309;
      --link: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      flex: 1;
      color: var(--text-strong);
    }

    header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
    }

    header .dot.offline { background: var(--err); }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      line-height: 1;
    }

    .icon-btn:hover { color: var(--text-muted); }
    .icon-btn.active { color: var(--text-strong); }

    /* ── Settings panel ── */
    #settings-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
    }

    #settings-panel.visible { display: flex; }

    #settings-panel label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }

    #settings-panel input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
    }

    #settings-panel input:focus { border-color: var(--accent); }

    #settings-panel .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #settings-panel .setting-group {
      margin-bottom: 8px;
    }

    #save-settings-btn {
      background: var(--accent-btn);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      padding: 10px 14px;
      white-space: nowrap;
      margin-top: 4px;
    }

    #save-settings-btn:hover { background: var(--accent-btn-hover); }

    #key-status { font-size: 11px; color: var(--ok); min-height: 16px; margin-top: 4px; }

    /* ── Main views ── */
    #main-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #prompt-section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    #prompt-input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      resize: none;
      min-height: 60px;
    }

    #prompt-input:focus { border-color: var(--accent); }
    #prompt-input::placeholder { color: var(--text-faint); }

    #run-btn {
      background: var(--accent-btn);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      align-self: flex-end;
    }

    #run-btn:hover { background: var(--accent-btn-hover); }
    #run-btn:disabled { background: var(--btn-disabled); cursor: not-allowed; }

    #status-bar {
      padding: 8px 16px;
      font-size: 11px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      min-height: 28px;
    }

    #status-bar.error { color: var(--err); }
    #status-bar.success { color: var(--ok); }

    #prefab-container {
      flex: 1;
      position: relative;
      min-height: 0;
      overflow-y: auto;
    }

    #prefab-root {
      min-height: 100%;
      padding: 16px;
    }

    #chart-root {
      padding: 16px;
      display: none;
      border-bottom: 1px solid var(--border);
    }

    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-faint);
    }

    #empty-state svg { opacity: 0.5; }
    #empty-state p { font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <div class="dot" id="server-dot"></div>
    <h1>IntelAgent</h1>
    <button id="reset-btn" class="icon-btn" title="Reset Connection">🔄</button>
    <button id="theme-btn" class="icon-btn" title="Toggle theme">🌙</button>
    <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
  </header>

  <div id="settings-panel">
    <div class="setting-group">
      <label for="api-key-input">Gemini API Key</label>
      <div class="row">
        <input id="api-key-input" type="password" placeholder="AIza…" />
      </div>
    </div>
    <div class="setting-group">
      <label for="mcp-url-input">MCP Server URL</label>
      <div class="row">
        <input id="mcp-url-input" type="text" placeholder="http://localhost:8000" />
      </div>
    </div>
    <button id="save-settings-btn">Save Settings</button>
    <div id="key-status"></div>
  </div>

  <div id="main-view">
    <div id="prompt-section">
      <textarea
        id="prompt-input"
        placeholder='e.g. "Fetch top 4 articles on Local LLMs. Filter duplicates, save new ones, generate a dashboard."'
      ></textarea>
      <button id="run-btn" disabled>Run</button>
    </div>

    <div id="status-bar">Checking server…</div>

    <div id="prefab-container">
      <div id="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 6h16M4 12h16M4 18h7" />
        </svg>
        <p>Run a prompt to see your curated dashboard</p>
      </div>
      <iframe id="prefab-frame" src="about:blank"
              style="width:100%;height:100%;border:0;display:none"></iframe>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
