<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AgentCurator Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      padding: 32px;
      max-width: 480px;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 24px; }
    label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #1a2033;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus { border-color: #4f81f0; }
    button {
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
    }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 12px; font-size: 12px; color: #34d399; min-height: 18px; }
  </style>
</head>
<body>
  <h1>AgentCurator Settings</h1>
  <label for="api-key-input">Gemini API Key</label>
  <input id="api-key-input" type="password" placeholder="AIza..." />
  <button id="save-btn">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
