[project]
name = "intel-agent"
version = "1.0.0"
description = "AI-powered research assistant with multi-source fetch and MCP orchestration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.14.2",
    "fastmcp>=3.2.4",
    "httpx>=0.28.1",
    "prefab-ui>=0.19.1",
    "python-dotenv>=1.2.2",
    "pytrends-modern[selenium]>=0.2.5",
    "torch>=2.11.0",
    "transformers>=5.8.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Deprecated in 0.9.0:DeprecationWarning",
]
